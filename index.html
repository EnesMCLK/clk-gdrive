<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulut Depom</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230b57d0'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z'/></svg>" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafd; --surface-color: #ffffff; --primary-color: #0b57d0;
            --text-main: #1f1f1f; --text-muted: #444746; --hover-color: #edf2fa; --border-color: #e0e0e0;
        }
        body { margin: 0; font-family: 'Product Sans', sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Navbar ve Butonlar */
        .navbar { display: flex; align-items: center; padding: 12px 24px; background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); gap: 16px; flex-shrink: 0; }
        .navbar h1 { font-size: 22px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 12px; }
        .btn-icon { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: 0.2s; }
        .btn-icon:hover { background-color: var(--hover-color); }
        .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .main-content { padding: 24px; flex: 1; overflow-y: auto; position: relative; }

        /* Görünüm Menüsü */
        .dropdown { position: relative; display: inline-block; margin-left: auto; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 180px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); z-index: 10; border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; margin-top: 5px; }
        .dropdown-content a { color: var(--text-main); padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; }
        .dropdown-content a:hover { background-color: var(--hover-color); }
        .show { display: block; }

        /* Ortak Kart Yapısı */
        .grid-container { display: grid; gap: 16px; }
        .item-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer; transition: 0.2s; user-select: none; position: relative; }
        .item-card:hover { background-color: var(--hover-color); border-color: #c2e7ff; }
        .item-name-wrapper { display: flex; align-items: center; overflow: hidden; }
        .item-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-details { display: none; font-size: 13px; color: var(--text-muted); }
        .icon-folder { color: #fbbc04; } .icon-pdf { color: #ea4335; } .icon-image { color: #188038; } .icon-doc { color: #4285f4; }
        .details-header { display: none; }

        /* Görünüm Tipleri */
        .view-large { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        .view-large .item-card { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
        .view-large .item-icon { font-size: 48px; }
        .view-large .item-name-wrapper { flex-direction: column; width: 100%; }

        .view-small { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .view-small .item-card { padding: 12px 16px; display: flex; align-items: center; }
        .view-small .item-icon { font-size: 24px; margin-right: 12px; }

        .view-list { grid-template-columns: 1fr; gap: 8px; }
        .view-list .item-card { padding: 12px 16px; display: flex; align-items: center; }
        .view-list .item-icon { font-size: 24px; margin-right: 16px; }

        .view-details { grid-template-columns: 1fr; gap: 0; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; background: white;}
        .view-details .details-header { display: grid; grid-template-columns: 3fr 1fr 1fr; padding: 12px 24px; background-color: #f1f3f4; font-weight: 600; font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
        .view-details .item-card { border: none; border-bottom: 1px solid var(--border-color); border-radius: 0; display: grid; grid-template-columns: 3fr 1fr 1fr; align-items: center; padding: 10px 24px; }
        .view-details .item-card:last-child { border-bottom: none; }
        .view-details .item-icon { font-size: 24px; margin-right: 16px; }
        .view-details .item-details { display: block; }

        /* --- YENİ EKLENENLER: SAĞ TIK MENÜSÜ --- */
        #contextMenu {
            display: none; position: fixed; background-color: var(--surface-color); border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1000; min-width: 160px; padding: 8px 0;
        }
        .context-menu-item {
            padding: 10px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-main); transition: background 0.1s;
        }
        .context-menu-item:hover { background-color: var(--hover-color); }

        /* --- YENİ EKLENENLER: AYRINTILAR PENCERESİ (MODAL) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(2px);
        }
        .modal-content {
            background: var(--surface-color); padding: 24px; border-radius: 16px; width: 320px; box-shadow: 0 12px 32px rgba(0,0,0,0.3); border: 1px solid var(--border-color);
        }
        .modal-header { font-size: 18px; font-weight: 500; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .modal-close { cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 50%; transition: 0.2s; display: flex;}
        .modal-close:hover { background-color: var(--hover-color); color: var(--text-main); }
        .modal-body { display: flex; flex-direction: column; gap: 12px; }
        .detail-row { display: flex; flex-direction: column; gap: 4px; }
        .detail-label { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}
        .detail-value { font-size: 14px; color: var(--text-main); word-break: break-all; }

        /* Yükleniyor */
        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: var(--primary-color); }
        .spinner { animation: spin 1s linear infinite; font-size: 40px; margin-bottom: 16px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="btn-icon" id="backBtn" onclick="goBack()" disabled title="Geri Git">
            <span class="material-icons-round">arrow_back</span>
        </button>
        <h1><span class="material-icons-round" style="color: var(--primary-color);">cloud</span>Bulut Depom</h1>
        
        <div class="dropdown">
            <button class="btn-icon" onclick="toggleViewMenu()" title="Görünüm Seçenekleri">
                <span class="material-icons-round" id="currentViewIcon">grid_view</span>
            </button>
            <div class="dropdown-content" id="viewDropdown">
                <a onclick="changeView('view-large', 'grid_view')"><span class="material-icons-round">grid_view</span> Büyük Simgeler</a>
                <a onclick="changeView('view-small', 'apps')"><span class="material-icons-round">apps</span> Küçük Simgeler</a>
                <a onclick="changeView('view-list', 'view_list')"><span class="material-icons-round">view_list</span> Listele</a>
                <a onclick="changeView('view-details', 'table_rows')"><span class="material-icons-round">table_rows</span> Ayrıntılar</a>
            </div>
        </div>

        <button class="btn-icon" onclick="refreshCurrentFolder()" title="Verileri Yenile">
            <span class="material-icons-round">refresh</span>
        </button>
    </div>

    <div class="main-content" id="mainArea">
        <div id="loader" class="loader-container">
            <span class="material-icons-round spinner">autorenew</span>
            <span style="color: var(--text-muted); font-weight: 500;">Sorgulanıyor...</span>
        </div>
        <div class="grid-container view-large" id="gridContainer" style="display: none;"></div>
    </div>

    <div id="contextMenu">
        <div class="context-menu-item" onclick="handleContextAction('download')">
            <span class="material-icons-round" id="ctxDownloadIcon">download</span> <span id="ctxDownloadText">İndir</span>
        </div>
        <div class="context-menu-item" onclick="handleContextAction('details')">
            <span class="material-icons-round">info</span> Ayrıntılar
        </div>
    </div>

    <div class="modal-overlay" id="detailsModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span style="display:flex; align-items:center; gap:8px;">
                    <span class="material-icons-round" id="modalIcon">info</span> Özellikler
                </span>
                <span class="material-icons-round modal-close" onclick="closeModal(true)">close</span>
            </div>
            <div class="modal-body" id="modalBody">
                </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'BURAYA_GOOGLE_SCRIPT_WEP_APP_URL_GELECEK'; 

        let historyStack = [];
        let currentActiveFolderId = null;
        let selectedItemForContext = null; // Sağ tıklanan öğeyi hafızada tutmak için

        document.addEventListener('DOMContentLoaded', () => {
            const savedView = localStorage.getItem('userView') || 'view-large';
            const savedIcon = localStorage.getItem('userViewIcon') || 'grid_view';
            changeView(savedView, savedIcon, false); 
            loadFolder(); 
        });

        // Ekranda boş bir yere sol veya sağ tıklanırsa menüleri kapat
        document.addEventListener('click', hideContextMenu);
        document.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.item-card')) hideContextMenu();
        });

        function toggleViewMenu() { document.getElementById("viewDropdown").classList.toggle("show"); }
        window.onclick = function(event) {
            if (!event.target.closest('.dropdown')) {
                let dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) dropdowns[i].classList.remove('show');
            }
        }

        function changeView(viewClass, iconName, save = true) {
            const container = document.getElementById('gridContainer');
            container.className = 'grid-container ' + viewClass;
            document.getElementById('currentViewIcon').innerText = iconName;
            if (save) { localStorage.setItem('userView', viewClass); localStorage.setItem('userViewIcon', iconName); }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            if (!bytes) return '--';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            if (!timestamp) return '--';
            const date = new Date(timestamp);
            return date.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute:'2-digit' });
        }

        function loadFolder(folderId = null, forceRefresh = false) {
            showLoader(true);
            currentActiveFolderId = folderId;
            const cacheKey = 'folderCache_' + (folderId || 'rootFolder');

            if (!forceRefresh) {
                const localCache = sessionStorage.getItem(cacheKey);
                if (localCache) {
                    renderItems(JSON.parse(localCache)); updateBackButton(); return; 
                }
            }

            let fetchUrl = APPS_SCRIPT_URL + '?';
            if (folderId) fetchUrl += `id=${folderId}&`;
            if (forceRefresh) fetchUrl += `refresh=true&`;

            fetch(fetchUrl)
                .then(r => r.json())
                .then(result => {
                    if (result.success) {
                        sessionStorage.setItem(cacheKey, JSON.stringify(result.data));
                        renderItems(result.data); updateBackButton();
                    } else { alert("Hata: " + result.error); showLoader(false); }
                }).catch(e => { alert("Bağlantı Hatası: " + e.message); showLoader(false); });
        }

        function refreshCurrentFolder() { loadFolder(currentActiveFolderId, true); }

        function renderItems(data) {
            const container = document.getElementById('gridContainer');
            container.innerHTML = ''; 

            container.innerHTML += `
                <div class="details-header">
                    <div>Ad</div><div>Değiştirilme Tarihi</div><div>Boyut</div>
                </div>
            `;

            // KLASÖRLER
            data.folders.forEach(folder => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-name-wrapper">
                        <span class="material-icons-round item-icon icon-folder">folder</span>
                        <span class="item-name" title="${folder.name}">${folder.name}</span>
                    </div>
                    <div class="item-details">${formatDate(folder.date)}</div>
                    <div class="item-details">--</div>
                `;
                // Sol Tık: Klasöre gir
                card.onclick = () => { historyStack.push(data.currentId); loadFolder(folder.id); };
                
                // Sağ Tık (veya Mobilde Uzun Basma): Menüyü aç
                card.oncontextmenu = (e) => {
                    e.preventDefault(); 
                    showContextMenu(e, { ...folder, isFolder: true });
                };
                container.appendChild(card);
            });

            // DOSYALAR
            data.files.forEach(file => {
                let iconName = 'insert_drive_file'; let iconColorClass = 'icon-doc';
                if (file.type.includes('pdf')) { iconName = 'picture_as_pdf'; iconColorClass = 'icon-pdf'; }
                else if (file.type.includes('image')) { iconName = 'image'; iconColorClass = 'icon-image'; }
                else if (file.type.includes('video')) { iconName = 'movie'; iconColorClass = 'icon-pdf'; }
                else if (file.type.includes('spreadsheet') || file.type.includes('excel')) { iconName = 'table_chart'; iconColorClass = 'icon-image'; }

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-name-wrapper">
                        <span class="material-icons-round item-icon ${iconColorClass}">${iconName}</span>
                        <span class="item-name" title="${file.name}">${file.name}</span>
                    </div>
                    <div class="item-details">${formatDate(file.date)}</div>
                    <div class="item-details">${formatBytes(file.size)}</div>
                `;
                
                // Sol Tık: Dosyayı İndir
                card.onclick = () => { triggerDownload(file); };
                
                // Sağ Tık: Menüyü aç
                card.oncontextmenu = (e) => {
                    e.preventDefault();
                    showContextMenu(e, { ...file, isFolder: false, iconColorClass, iconName });
                };
                container.appendChild(card);
            });

            if (data.folders.length === 0 && data.files.length === 0) {
                container.innerHTML += '<div style="grid-column: 1 / -1; text-align: center; color: #666; padding: 40px;">Bu klasör boş.</div>';
            }
            showLoader(false);
        }

        // --- YENİ İŞLEMLER: SAĞ TIK VE PENCERE FONKSİYONLARI ---

        function showContextMenu(e, item) {
            selectedItemForContext = item;
            const menu = document.getElementById('contextMenu');
            
            // Klasörse menü metnini Drive'da aç olarak değiştir
            if(item.isFolder) {
                document.getElementById('ctxDownloadIcon').innerText = "open_in_new";
                // İŞTE DEĞİŞEN KISIM BURASI:
                document.getElementById('ctxDownloadText').innerText = "Klasörü İndir (Drive'a Yönlendirir)";
            } else {
                document.getElementById('ctxDownloadIcon').innerText = "download";
                document.getElementById('ctxDownloadText').innerText = "Hemen İndir";
            }

            // ... kodun geri kalanı ...

            menu.style.display = 'block';
            
            // Menünün ekrandan taşmasını engellemek için koordinat hesaplaması
            let x = e.clientX;
            let y = e.clientY;
            if (x + menu.offsetWidth > window.innerWidth) x = window.innerWidth - menu.offsetWidth - 10;
            if (y + menu.offsetHeight > window.innerHeight) y = window.innerHeight - menu.offsetHeight - 10;

            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
        }

        function hideContextMenu() { document.getElementById('contextMenu').style.display = 'none'; }

        function handleContextAction(action) {
            hideContextMenu();
            if (!selectedItemForContext) return;
            
            if (action === 'download') {
                if (selectedItemForContext.isFolder) {
                    // Klasörse Google Drive Linkini Aç
                    window.open(`https://drive.google.com/drive/folders/${selectedItemForContext.id}`, '_blank');
                } else {
                    // Dosyaysa Direkt İndir
                    triggerDownload(selectedItemForContext);
                }
            } else if (action === 'details') {
                openDetailsModal(selectedItemForContext);
            }
        }

        function triggerDownload(file) {
            if (!file.type.includes('google-apps')) {
                const directDownloadUrl = `https://drive.google.com/uc?export=download&id=${file.id}`;
                const link = document.createElement('a'); link.href = directDownloadUrl; link.target = '_blank';
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            } else {
                const link = document.createElement('a'); link.href = file.url; link.target = '_blank';
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            }
        }

        function openDetailsModal(item) {
            const modal = document.getElementById('detailsModal');
            const body = document.getElementById('modalBody');
            const icon = document.getElementById('modalIcon');
            
            icon.innerText = item.isFolder ? 'folder' : item.iconName || 'insert_drive_file';
            icon.style.color = item.isFolder ? '#fbbc04' : '#4285f4';

            body.innerHTML = `
                <div class="detail-row"><span class="detail-label">Dosya Adı</span><span class="detail-value" style="font-weight:500;">${item.name}</span></div>
                <div class="detail-row"><span class="detail-label">Tür</span><span class="detail-value">${item.isFolder ? 'Dosya Klasörü' : item.type}</span></div>
                <div class="detail-row"><span class="detail-label">Boyut</span><span class="detail-value">${item.isFolder ? 'Klasör boyutu hesaplanmıyor' : formatBytes(item.size)}</span></div>
                <div class="detail-row"><span class="detail-label">Son Değiştirilme</span><span class="detail-value">${formatDate(item.date)}</span></div>
            `;
            modal.style.display = 'flex';
        }

        function closeModal(force = false) {
            if (force || event.target.id === 'detailsModal') document.getElementById('detailsModal').style.display = 'none';
        }

        function goBack() { if (historyStack.length > 0) loadFolder(historyStack.pop()); }
        function updateBackButton() { document.getElementById('backBtn').disabled = historyStack.length === 0; }
        function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; document.getElementById('gridContainer').style.display = show ? 'none' : 'grid'; }
    </script>
</body>
</html>
