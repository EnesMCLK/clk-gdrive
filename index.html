<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulut Depom</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230b57d0'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z'/></svg>" type="image/svg+xml">

    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafd;
            --surface-color: #ffffff;
            --primary-color: #0b57d0;
            --text-main: #1f1f1f;
            --text-muted: #444746;
            --hover-color: #edf2fa;
            --border-color: #e0e0e0;
        }

        body {
            margin: 0;
            font-family: 'Product Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Üst Menü / Navbar */
        .navbar {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            gap: 16px;
        }

        .navbar h1 {
            font-size: 22px;
            font-weight: 500;
            margin: 0;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: background 0.2s;
        }

        .btn-back:hover { background-color: var(--hover-color); }
        .btn-back:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Ana İçerik Alanı */
        .main-content {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }

        /* Izgara Yapısı */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* Dosya / Klasör Kartları */
        .item-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .item-card:hover {
            background-color: var(--hover-color);
            border-color: #c2e7ff;
        }

        .item-icon {
            font-size: 28px;
        }

        /* İkon Renkleri */
        .icon-folder { color: #fbbc04; } /* Klasör Sarısı */
        .icon-pdf { color: #ea4335; } /* PDF Kırmızısı */
        .icon-image { color: #188038; } /* Resim Yeşili */
        .icon-doc { color: #4285f4; } /* Döküman Mavisi */

        .item-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Yükleniyor Ekranı */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: var(--primary-color);
        }

        .spinner {
            animation: spin 1s linear infinite;
            font-size: 40px;
            margin-bottom: 16px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="btn-back" id="backBtn" onclick="goBack()" disabled title="Geri Git">
            <span class="material-icons-round">arrow_back</span>
        </button>
        <h1>
            <span class="material-icons-round" style="color: var(--primary-color);">cloud</span>
            Bulut Depom
        </h1>
        <button class="btn-back" style="margin-left: auto;" onclick="refreshCurrentFolder()" title="Verileri Yenile">
            <span class="material-icons-round">refresh</span>
        </button>
    </div>

    <div class="main-content">
        <div id="loader" class="loader-container">
            <span class="material-icons-round spinner">autorenew</span>
            <span style="color: var(--text-muted); font-weight: 500;">Dosyalar getiriliyor...</span>
        </div>

        <div class="grid-container" id="gridContainer" style="display: none;">
            </div>
    </div>

    <script>
        // --- AYARLAR ---
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUNiaNw7Ryg21tGMSHYT3aYU5tnN0TAfLw5nhTgQUyDLq-_t_qnG3fH8m6HBlf3C8f/exec'; 

        let historyStack = [];
        let currentActiveFolderId = null; // Şu an bulunduğumuz klasörü akılda tutmak için

        document.addEventListener('DOMContentLoaded', () => {
            loadFolder(); 
        });

        // forceRefresh parametresi eklendi
        function loadFolder(folderId = null, forceRefresh = false) {
            showLoader(true);
            currentActiveFolderId = folderId; // Mevcut klasörü kaydet
            
            let fetchUrl = APPS_SCRIPT_URL + '?';
            if (folderId) fetchUrl += `id=${folderId}&`;
            if (forceRefresh) fetchUrl += `refresh=true&`; // Yenileme sinyali!

            fetch(fetchUrl)
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        renderItems(result.data);
                        updateBackButton();
                    } else {
                        alert("Veri çekilemedi: " + result.error);
                        showLoader(false);
                    }
                })
                .catch(error => {
                    console.error('API Hatası:', error);
                    alert("Ağa bağlanılamadı.");
                    showLoader(false);
                });
        }

        // Yenile butonuna basıldığında çalışacak fonksiyon
        function refreshCurrentFolder() {
            // Bulunduğumuz klasörü "forceRefresh = true" ile tekrar yükle
            loadFolder(currentActiveFolderId, true);
        }

        function renderItems(data) {
            const container = document.getElementById('gridContainer');
            container.innerHTML = ''; 

            data.folders.forEach(folder => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `<span class="material-icons-round item-icon icon-folder">folder</span><span class="item-name" title="${folder.name}">${folder.name}</span>`;
                card.onclick = () => {
                    historyStack.push(data.currentId); 
                    loadFolder(folder.id); 
                };
                container.appendChild(card);
            });

            data.files.forEach(file => {
                let iconName = 'insert_drive_file';
                let iconColorClass = 'icon-doc';
                if (file.type.includes('pdf')) { iconName = 'picture_as_pdf'; iconColorClass = 'icon-pdf'; }
                else if (file.type.includes('image')) { iconName = 'image'; iconColorClass = 'icon-image'; }
                else if (file.type.includes('video')) { iconName = 'movie'; iconColorClass = 'icon-pdf'; }
                else if (file.type.includes('spreadsheet') || file.type.includes('excel')) { iconName = 'table_chart'; iconColorClass = 'icon-image'; }

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `<span class="material-icons-round item-icon ${iconColorClass}">${iconName}</span><span class="item-name" title="${file.name}">${file.name}</span>`;
                card.onclick = () => window.open(file.url, '_blank');
                container.appendChild(card);
            });

            if (data.folders.length === 0 && data.files.length === 0) {
                container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #666; padding: 40px;">Bu klasör boş.</div>';
            }
            showLoader(false);
        }

        function goBack() {
            if (historyStack.length > 0) {
                const previousFolderId = historyStack.pop();
                loadFolder(previousFolderId);
            }
        }

        function updateBackButton() {
            document.getElementById('backBtn').disabled = historyStack.length === 0;
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
            document.getElementById('gridContainer').style.display = show ? 'none' : 'grid';
        }
    </script>
</body>
</html>
