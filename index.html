<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Bulut Depom | Kurumsal Arşiv ve Dosya Yönetim Sistemi</title>
    <meta name="description" content="Bulut Depom; kurumsal verilerinize güvenli, şifreli ve yüksek hızlı erişim sağlayan profesyonel bir bulut depolama çözümüdür. İş sürekliliği ve güvenli dosya paylaşımı için optimize edilmiştir.">
    <meta name="keywords" content="kurumsal depolama, dosya yönetimi, güvenli arşiv, bulut bilişim, veri saklama">
    <meta name="author" content="EnesMCLK">
    <meta name="publisher" content="Bulut Depom Kurumsal">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="Bulut Depom - Güvenli Dosya Yönetimi">
    <meta property="og:description" content="Kurumsal dosyalarınıza 7/24 kesintisiz ve güvenli erişim sağlayın.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bulutdepom.com">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230b57d0'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z'/></svg>" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root { --bg-color: #f8fafd; --surface-color: #ffffff; --primary-color: #0b57d0; --text-main: #1f1f1f; --text-muted: #444746; --hover-color: #edf2fa; --border-color: #e0e0e0; }
        body { margin: 0; font-family: 'Product Sans', sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--surface-color); padding: 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); border: 1px solid var(--border-color); width: 100%; max-width: 340px; text-align: center; }
        .login-btn { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .login-input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; outline: none; }
        
        /* NAVBAR VE BİLEŞENLER */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); flex-shrink: 0; position: relative; }
        .navbar-left h1 { font-size: 22px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 12px; }
        .server-status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #9e9e9e; }
        .status-dot.online { background-color: #188038; box-shadow: 0 0 6px rgba(24, 128, 56, 0.6); }
        .status-dot.checking { animation: pulse 1s infinite alternate; }
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        .main-content { padding: 24px; flex: 1; overflow-y: auto; }
        .grid-container { display: grid; gap: 16px; }
        .item-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px 12px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .item-card:hover { background-color: var(--hover-color); border-color: #c2e7ff; }
        .item-icon { font-size: 48px; margin-bottom: 12px; }
        .icon-folder { color: #fbbc04; } .icon-pdf { color: #ea4335; } .icon-word { color: #4285f4; }
        
        .spinner { animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* GÖRÜNÜM MODLARI */
        .view-large { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        .view-list { grid-template-columns: 1fr; }
        .view-list .item-card { display: flex; align-items: center; text-align: left; padding: 12px 24px; gap: 16px; }
        .view-list .item-icon { margin-bottom: 0; font-size: 24px; }
    </style>
</head>
<body>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <span class="material-icons-round" style="color: var(--primary-color); font-size: 48px;">cloud</span>
            <h2>Bulut Depom</h2>
            <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Kurumsal Erişim Paneli</p>
            <div id="loginError" style="color: #d93025; font-size: 13px; margin-bottom: 10px; display: none;">Hata!</div>
            <input type="text" id="usernameInput" class="login-input" placeholder="Kullanıcı Adı">
            <input type="password" id="passwordInput" class="login-input" placeholder="Şifre" onkeypress="if(event.key==='Enter') checkLogin()">
            <button class="login-btn" id="loginBtnId" onclick="checkLogin()">Giriş Yap</button>
        </div>
    </div>

    <div id="appContainer" style="display: none; flex-direction: column; height: 100vh;">
        <div class="navbar">
            <div class="navbar-left">
                <h1><span class="material-icons-round" style="color: var(--primary-color);">cloud_done</span> Bulut Depom</h1>
            </div>
            <div class="server-status">
                <div class="status-dot checking" id="navStatusDot"></div>
                <span id="navStatusText">Sistem Kontrol Ediliyor...</span>
            </div>
            <div class="navbar-right">
                <button class="login-btn" style="background:#f1f3f4; color:#3c4043; padding:8px 16px;" onclick="logout()">Çıkış</button>
            </div>
        </div>

        <div class="main-content" id="mainArea">
            <div id="loader" style="text-align:center; padding-top:100px;">
                <span class="material-icons-round spinner" style="font-size:48px; color:var(--primary-color);">autorenew</span>
                <p>Dosyalar taranıyor...</p>
            </div>
            <div class="grid-container view-large" id="gridContainer" style="display: none;"></div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'BURAYA_APPS_SCRIPT_URL_GELECEK';
        const SECURE_DL_GATEWAY = 'https://indir.bulutdepom.com'; // Kurumsal engeli aşan adres

        let currentActiveFolderId = null;
        let allCurrentItems = [];

        // GİRİŞ KONTROLÜ
        function checkLogin() {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;
            const btn = document.getElementById('loginBtnId');
            
            btn.innerText = 'Doğrulanıyor...'; btn.disabled = true;

            fetch(`${APPS_SCRIPT_URL}?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`)
                .then(r => r.json())
                .then(result => {
                    if (result.success) {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('authUser', user);
                        sessionStorage.setItem('authPass', pass);
                        showApp(result.data);
                    } else {
                        document.getElementById('loginError').style.display = 'block';
                        btn.innerText = 'Giriş Yap'; btn.disabled = false;
                    }
                });
        }

        function showApp(data) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            renderItems(data);
            updateStatusUI('online');
        }

        function logout() { sessionStorage.clear(); location.reload(); }

        // DOSYA VE KLASÖR LİSTELEME
        function renderItems(data) {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            document.getElementById('loader').style.display = 'none';
            container.style.display = 'grid';

            allCurrentItems = [];
            data.folders.forEach(f => allCurrentItems.push({...f, isFolder: true}));
            data.files.forEach(f => allCurrentItems.push({...f, isFolder: false}));

            allCurrentItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                const icon = item.isFolder ? 'folder' : 'description';
                const color = item.isFolder ? 'icon-folder' : 'icon-word';
                
                card.innerHTML = `
                    <span class="material-icons-round item-icon ${color}">${icon}</span>
                    <div style="font-weight:500; font-size:14px;">${item.name}</div>
                `;
                card.onclick = () => triggerDownload(item, card);
                container.appendChild(card);
            });
        }

        // AKILLI İNDİRME MOTORU (ZIP DESTEKLİ)
        async function triggerDownload(item, element) {
            const originalHtml = element.innerHTML;

            if (item.isFolder) {
                // KLASÖR: Tarayıcı tabanlı ZIP oluşturma
                element.innerHTML = '<span class="material-icons-round spinner">autorenew</span><p>Zipleniyor...</p>';
                try {
                    const zip = new JSZip();
                    await addFolderToZip(item.id, item.name, zip);
                    const content = await zip.generateAsync({type: "blob"});
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = item.name + ".zip";
                    link.click();
                } catch (e) { alert("ZIP hatası!"); }
                element.innerHTML = originalHtml;
                return;
            }

            // DOSYA: Worker üzerinden indirme
            const dlUrl = `${SECURE_DL_GATEWAY}/?id=${item.id}&type=${encodeURIComponent(item.type)}&name=${encodeURIComponent(item.name)}`;
            window.open(dlUrl, '_blank');
        }

        // ÖZYİNELEMELİ KLASÖR TARAMA
        async function addFolderToZip(folderId, folderName, zipObj) {
            const u = sessionStorage.getItem('authUser');
            const p = sessionStorage.getItem('authPass');
            const response = await fetch(`${APPS_SCRIPT_URL}?user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}&id=${folderId}`);
            const result = await response.json();
            
            const folderZip = zipObj.folder(folderName);
            
            const filePromises = result.data.files.map(async (file) => {
                const fileReq = await fetch(`${SECURE_DL_GATEWAY}/?id=${file.id}&type=${encodeURIComponent(file.type)}&name=${encodeURIComponent(file.name)}`);
                const blob = await fileReq.blob();
                folderZip.file(file.name, blob);
            });

            const folderPromises = result.data.folders.map(async (sub) => {
                await addFolderToZip(sub.id, sub.name, folderZip);
            });

            await Promise.all([...filePromises, ...folderPromises]);
        }

        function updateStatusUI(state) {
            const dot = document.getElementById('navStatusDot');
            const txt = document.getElementById('navStatusText');
            if(state==='online') { dot.className='status-dot online'; txt.innerText='Bulut Erişimi Aktif'; }
        }
    </script>
</body>
</html>
